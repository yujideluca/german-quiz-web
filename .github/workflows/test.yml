name: test

# Every push and pull request runs the whole web test suite (domain, conformance vectors shared with the
# Android app, content, i18n, architecture rules). No dependencies to install: plain Node test runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/pipeline-check
      # pipeline-check runs tools/quality_gate.sh (npm test + its own tests) once and then the fitness checks;
      # a `falha` fails this job.
      - run: tools/pipeline-check.sh --mode ci
